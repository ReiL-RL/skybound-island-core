# SkyBound Island Core - Configuration

# What block to use when SopCustomBlocks is NOT available
fallback-block: BEACON

# Whether to place core blocks automatically on island creation
place-on-create: true

# Which cores to place on island create/regen (at center)
auto-place-on-create:
  - xp_core
  - booster_core
  - upgrade_core

# Particle effect above core blocks
particles:
  enabled: true
  type: END_ROD
  count: 3
  interval-ticks: 10
